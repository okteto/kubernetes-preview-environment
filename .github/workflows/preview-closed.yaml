on: 
  pull_request: 
    types:
      - closed

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Login
      uses: okteto/login@2.31.0
      with:
        token: ${{ secrets.OKTETO_TOKEN }}

    - name: Delete namespace
      uses: okteto/destroy-preview@3.11.0
      with:
        name: pr-${{ github.event.number }}-cindylopez
