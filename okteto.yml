icon: https://apps.okteto.com/movies/icon.png

build:
  api:
    context: api
  frontend:
    context: frontend

deploy:
  # Use official MongoDB Helm chart instead of custom StatefulSet
  - helm repo add bitnami https://charts.bitnami.com/bitnami || true
  - helm upgrade --install mongodb bitnami/mongodb --version 13.18.5 --set auth.rootPassword="Password!1@2",auth.username="okteto",auth.password="Password!1@2",auth.database="okteto" --wait
  - helm upgrade --install movies chart --set api.image=${OKTETO_BUILD_API_IMAGE} --set frontend.image=${OKTETO_BUILD_FRONTEND_IMAGE} --set tag="" --wait

dev:
  api:
    image: ${OKTETO_BUILD_API_IMAGE}
    command: ["bash"]
    forward:
      - 8080:8080
      - 9229:9229
    sync:
      - api:/src
    environment:
      - MONGODB_HOST=mongodb
      - MONGO_INITDB_ROOT_PASSWORD=Password!1@2
      - MONGO_INITDB_DATABASE=okteto
    persistentVolume:
      enabled: false

  frontend:
    image: ${OKTETO_BUILD_FRONTEND_IMAGE}
    command: yarn start
    sync:
      - frontend:/src
    persistentVolume:
      enabled: false

test:
  api:
    image: ${OKTETO_BUILD_API_IMAGE}
    commands:
      - echo "Running API health check..."
      - node -e "require('http').get('http://localhost:8080/api/healthz', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"