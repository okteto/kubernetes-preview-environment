icon: https://apps.okteto.com/movies/icon.png

build:
  api:
    context: api
  frontend:
    context: frontend

deploy:
  # Use custom MongoDB templates with official MongoDB image
  - helm upgrade --install movies chart --set api.image=${OKTETO_BUILD_API_IMAGE} --set frontend.image=${OKTETO_BUILD_FRONTEND_IMAGE} --set tag="" --wait

dev:
  api:
    image: ${OKTETO_BUILD_API_IMAGE}
    command: ["sh", "-c", "yarn install && yarn start"]
    forward:
      - 8080:8080
      - 9229:9229
    sync:
      - api:/src
    environment:
      - MONGODB_HOST=mongodb
      - MONGO_INITDB_ROOT_PASSWORD=Password!1@2
      - MONGO_INITDB_DATABASE=okteto
      - MONGODB_PASSWORD=Password!1@2
      - MONGODB_USERNAME=root
      - MONGODB_DATABASE=okteto
    persistentVolume:
      enabled: false

  frontend:
    image: ${OKTETO_BUILD_FRONTEND_IMAGE}
    command: ["sh", "-c", "yarn install && yarn start"]
    forward:
      - 3000:80
    sync:
      - frontend:/src
    persistentVolume:
      enabled: false

test:
  api:
    image: ${OKTETO_BUILD_API_IMAGE}
    commands:
      - echo "Running API health check..."
      - apk add --no-cache curl && curl -f http://localhost:8080/api/healthz